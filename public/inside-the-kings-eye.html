<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داخل عين الملك — THE KING'S EYE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--ink:#f3e9d6;--mute:#a99c84;--gold:#d9b469;--gold2:#f2d99a;--line:rgba(217,180,105,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 70% 0%,#1a1308 0%,var(--bg) 55%);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;gap:12px}
.logo{display:flex;flex-direction:column;align-items:center;letter-spacing:.38em;font-size:13px;color:var(--gold2);direction:ltr}
.logo svg{width:34px;height:20px;margin-bottom:4px}
.badge{font-size:12px;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:3px 12px;white-space:nowrap}
.skip{background:none;border:1px solid var(--line);border-radius:99px;padding:3px 14px;font-size:12px;color:var(--mute)}
/* opening */
#intro{position:fixed;inset:0;z-index:20;background:radial-gradient(90% 70% at 50% 40%,#1d1509,#050505);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1s ease,visibility 1s;padding:24px}
#intro.off{opacity:0;visibility:hidden}
#intro svg{width:min(70vw,360px);height:auto}
#intro h1{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(40px,8vw,76px);margin:12px 0 0;color:var(--gold2);opacity:0;animation:rise 1.4s .6s forwards}
#intro p{color:var(--mute);margin:6px 0 22px;opacity:0;animation:rise 1.4s 1.3s forwards}
#intro .skip{opacity:0;animation:rise 1s 1.8s forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* stage */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;max-width:1180px;margin:0 auto;padding:6px 28px 20px}
.ring{fill:none;stroke:var(--line);stroke-width:1}
.sweep{transform-origin:200px 200px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.city{fill:var(--mute);font-size:11px;font-family:Tajawal,sans-serif}
.dot{fill:var(--gold)}
.pulse{fill:none;stroke:var(--gold);transform-box:fill-box;transform-origin:center;animation:pl 2.8s ease-out infinite}
@keyframes pl{from{transform:scale(.4);opacity:.9}to{transform:scale(2.6);opacity:0}}
[data-s]{opacity:0;transition:opacity .8s ease}
svg[data-m="1"] [data-s~="1"],svg[data-m="2"] [data-s~="2"],svg[data-m="3"] [data-s~="3"],svg[data-m="4"] [data-s~="4"],svg[data-m="5"] [data-s~="5"]{opacity:1}
.route{fill:none;stroke:var(--gold2);stroke-width:1.6;stroke-dasharray:6 6}
.cockpit{position:relative;aspect-ratio:600/620;width:100%;max-width:560px;margin:0 auto;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#050506}
.cockpit canvas,.cockpit svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cp{direction:ltr}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;fill:var(--gold);text-transform:uppercase}
.mono.m{fill:var(--mute)}.mono.v{font-size:14px;fill:var(--ink);letter-spacing:.04em}
.co{font-family:Tajawal,"Segoe UI",sans-serif;font-size:13px;fill:var(--ink)}
.hair{stroke:var(--gold);stroke-opacity:.35;stroke-width:1;fill:none}
.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
.sw2{animation:spin 4s linear infinite}
.drift{animation:dr 9s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(18px)}}
.flow{stroke-dasharray:4 6;animation:flw 1.4s linear infinite}@keyframes flw{to{stroke-dashoffset:-20}}
.chase{animation:ch 1.1s ease-in-out infinite}@keyframes ch{0%,100%{opacity:.15}50%{opacity:1}}
.blink{animation:bk 1.6s steps(2,end) infinite}@keyframes bk{50%{opacity:.15}}
.breathe{animation:br 4s ease-in-out infinite}@keyframes br{50%{opacity:.5}}
.inst{opacity:0;transition:opacity 1.4s ease}#cp.on .inst{opacity:1}
#hud{opacity:0;transition:opacity 1.2s ease .3s}#cp.on #hud{opacity:1}
.tick{opacity:0;transition:opacity .6s}.done .tick{opacity:1}.dotin{transition:opacity .4s}.done .dotin{opacity:0}
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing i{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:td 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chat{min-height:300px}
html[lang=ar] #t-jet,html[lang=ar] #t-car,html[lang=ar] #t-hotel,html[lang=ar] #t-appr,html[lang=ar] #t-adv,html[lang=ar] #t-wx,html[lang=ar] #etaT{letter-spacing:0;font-family:Tajawal,"Segoe UI",sans-serif;font-size:12px;text-transform:none}
.panel{min-width:0}
.eyebrow{color:var(--gold);letter-spacing:.2em;font-size:13px;direction:ltr;text-align:right}
.panel h2{font-family:"Aref Ruqaa",serif;font-size:clamp(34px,5vw,54px);line-height:1.25;margin:4px 0 6px;color:var(--gold2);font-weight:700}
.msg{font-size:clamp(17px,2.2vw,21px);color:var(--ink);margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 16px;max-width:48ch}
/* concierge conversation */
.chat{background:rgba(22,22,26,.6);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px)}
.sim{display:inline-block;font-size:11px;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:1px 10px;margin-bottom:12px}
.log{display:flex;flex-direction:column;gap:10px}
.b{max-width:90%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.7;opacity:0;animation:rise .7s both}
.b.e{align-self:flex-start;background:#16161a;border:1px solid var(--line)}
.b.c{align-self:flex-end;background:#c9a22733;border:1px solid rgba(201,162,39,.35)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;opacity:0;animation:rise .7s both}
.pill{border:1px solid var(--gold);color:var(--gold2);background:rgba(217,180,105,.05);border-radius:999px;padding:7px 18px;font-size:14px;transition:background .3s}
.pill:hover{background:rgba(217,180,105,.16)}
.pill.pri{background:linear-gradient(90deg,#c79d4e,#f2d99a);color:#201505;border:0;font-weight:700}
.more{background:none;border:0;color:var(--gold);padding:12px 0 0;font-size:14px}
.detail{display:none;color:var(--mute);font-size:14px;margin:6px 0 0}
.detail.open{display:block}
/* nav */
nav{max-width:1180px;margin:0 auto;padding:0 28px 28px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.steps button{min-width:0;overflow-wrap:anywhere;hyphens:auto;background:none;border:0;border-top:2px solid var(--line);padding:10px 4px 0;text-align:right;color:var(--mute);transition:.4s}
.steps button small{display:block;direction:ltr;text-align:right;letter-spacing:.2em;font-size:11px}
.steps button.on{border-color:var(--gold);color:var(--gold2)}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:99px;padding:9px 22px}
.btn.gold{background:linear-gradient(90deg,#c79d4e,#f2d99a);color:#201505;border:0;font-weight:700}
.btn[disabled]{opacity:.3;cursor:default}
.fade{animation:rise .7s both}
.langs{display:flex;gap:6px}.langs button{background:none;border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:12px;color:var(--mute)}.langs button.on{color:#201505;background:var(--gold);border-color:var(--gold)}
html[dir=ltr] .eyebrow,html[dir=ltr] .steps button,html[dir=ltr] .steps small{text-align:left}html[dir=ltr] .panel h2,html[dir=ltr] .msg{letter-spacing:0}
@media(max-width:820px){#replay{display:none}}
#final{display:none;text-align:center;max-width:1180px;margin:0 auto;padding:10px 28px 40px}
#final h3{font-family:"Aref Ruqaa",serif;font-size:clamp(30px,5vw,48px);margin:0;color:var(--gold2)}
@media(max-width:820px){header{flex-wrap:wrap;justify-content:center;row-gap:10px}.logo{order:-1;width:100%;white-space:nowrap;letter-spacing:.24em}.badge{font-size:11px}main{grid-template-columns:1fr;gap:6px}.cockpit{max-width:400px}header{padding:14px 16px}main,nav,#final{padding-inline:16px}.steps button{font-size:11px;line-height:1.35}.ctrl{flex-wrap:wrap}.b{max-width:96%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<div id="intro" role="dialog" aria-label="افتتاحية">
  <svg viewBox="0 0 400 400" aria-hidden="true">
    <circle class="ring" cx="200" cy="200" r="60"/><circle class="ring" cx="200" cy="200" r="110"/><circle class="ring" cx="200" cy="200" r="160"/><circle class="ring" cx="200" cy="200" r="192"/>
    <defs><radialGradient id="g0"><stop offset="0" stop-color="#f2d99a"/><stop offset="1" stop-color="#d9b469" stop-opacity="0"/></radialGradient>
    <linearGradient id="sw0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b469" stop-opacity=".5"/><stop offset="1" stop-color="#d9b469" stop-opacity="0"/></linearGradient></defs>
    <path class="sweep" d="M200 200 L392 200 A192 192 0 0 0 340 68 Z" fill="url(#sw0)"/>
    <circle cx="200" cy="200" r="34" fill="url(#g0)"/><circle cx="200" cy="200" r="12" fill="#0a0806" stroke="#f2d99a" stroke-width="2"/><circle cx="203" cy="198" r="3" fill="#f2d99a"/>
  </svg>
  <h1>داخل عين الملك</h1>
  <p>خمس لحظات تريك كيف ترى العين، وكيف تستعد.</p>
  <button class="skip" id="skip">ادخل مباشرة</button>
</div>

<header>
  <span class="badge">عرض تجريبي · محاكاة</span>
  <div class="logo"><svg viewBox="0 0 34 20" fill="none" stroke="#d9b469" stroke-width="1.3"><path d="M1 10C7 2 27 2 33 10 27 18 7 18 1 10Z"/><circle cx="17" cy="10" r="4"/><circle cx="17" cy="10" r="1.4" fill="#d9b469"/></svg>THE KING'S EYE</div>
  <div class="langs" id="langs"><button data-l="ar" class="on">العربية</button><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="tr">TR</button></div><button class="skip" id="replay">إعادة الافتتاحية</button>
</header>

<main id="stage">
  <div class="cockpit" id="cockpit">
    <canvas id="sky" aria-hidden="true"></canvas>
    <svg id="cp" data-m="1" viewBox="0 0 600 620" aria-hidden="true">
      <defs>
        <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d9b469" stop-opacity=".26"/><stop offset="1" stop-color="#d9b469" stop-opacity="0"/></radialGradient>
        <clipPath id="ca"><circle cx="120" cy="525" r="58"/></clipPath>
        <clipPath id="ct"><rect x="196" y="82" width="208" height="34"/></clipPath>
        <filter id="bl" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>

      <!-- always-on HUD on the windshield -->
      <g id="hud">
        <g clip-path="url(#ct)"><g id="tapeG"></g></g>
        <path d="M294 124L306 124L300 114Z" fill="#f2d99a"/>
        <text class="mono m" x="88" y="132">GS</text><text class="mono v" id="spdT" x="88" y="150">476</text>
        <text class="mono m" x="512" y="132" text-anchor="end">ALT</text><text class="mono v" id="altT" x="512" y="150" text-anchor="end">41,000</text>
        <g id="fpv">
          <circle cx="300" cy="238" r="7" fill="none" stroke="#f2d99a" stroke-width="1.4"/>
          <path d="M282 238H293M307 238H318M300 231V224" stroke="#f2d99a" stroke-width="1.4" fill="none"/>
          <circle id="ack" cx="300" cy="238" r="8" fill="none" stroke="#f2d99a" stroke-width="1.4" opacity="0"/>
        </g>
        <text class="mono" id="okT" x="300" y="296" text-anchor="middle" opacity="0"></text>
      </g>

      <!-- 1 · watching: weather scope, drifting cells -->
      <g data-s="1">
        <g filter="url(#bl)"><ellipse class="drift" cx="170" cy="262" rx="46" ry="11" fill="#e0b45a" fill-opacity=".34"/><ellipse class="drift" style="animation-delay:-4s;animation-direction:alternate-reverse" cx="420" cy="266" rx="62" ry="13" fill="#e0b45a" fill-opacity=".28"/></g>
        <circle cx="470" cy="190" r="44" fill="rgba(8,8,10,.55)" stroke="#d9b469" stroke-opacity=".4"/><circle cx="470" cy="190" r="26" class="hair"/><path d="M426 190H514M470 146V234" class="hair" style="stroke-opacity:.18"/>
        <path class="sw2" style="transform-origin:470px 190px" d="M470 190L514 190A44 44 0 0 0 501 159Z" fill="#d9b469" fill-opacity=".28"/>
        <circle class="pulse" cx="488" cy="170" r="4"/><circle class="pulse" cx="452" cy="206" r="4" style="animation-delay:1.1s"/><circle cx="488" cy="170" r="1.8" fill="#f2d99a"/><circle cx="452" cy="206" r="1.8" fill="#e0b45a"/>
        <text class="mono" id="t-wx" x="470" y="250" text-anchor="middle">WX</text>
      </g>

      <!-- 2 · understands: preference callouts around the flight path -->
      <g data-s="2">
        <circle class="pulse" cx="300" cy="238" r="20"/>
        <g class="fl"><path d="M222 176L286 230" class="hair"/><path d="M216 176l4-4 4 4-4 4z" fill="#f2d99a"/><text class="co" id="t-co1" x="170" y="170" text-anchor="middle">الإقلاع · بعد الظهر</text></g>
        <g class="fl" style="animation-delay:-1.6s"><path d="M378 214L314 236" class="hair"/><path d="M382 214l4-4 4 4-4 4z" fill="#f2d99a"/><text class="mono" id="t-co2" x="440" y="206" text-anchor="middle" style="font-size:13px">G450</text></g>
        <g class="fl" style="animation-delay:-3.2s"><path d="M236 306L288 248" class="hair"/><path d="M230 306l4-4 4 4-4 4z" fill="#f2d99a"/><text class="co" id="t-co3" x="170" y="326" text-anchor="middle">قهوة عربية</text></g>
      </g>

      <!-- 3 · opportunities: calendar ping on the route ahead -->
      <g data-s="3">
        <path d="M300 238Q232 238 176 232" class="hair" style="stroke-opacity:.2;stroke-dasharray:3 5"/>
        <path d="M300 238Q380 230 470 214" class="route"/>
        <circle r="2.8" fill="#f2d99a"><animateMotion dur="4.6s" repeatCount="indefinite" path="M300 238Q380 230 470 214"/></circle>
        <path d="M470 207l7 7-7 7-7-7z" fill="none" stroke="#f2d99a" stroke-width="1.4"/><circle class="pulse" cx="470" cy="214" r="9"/>
        <text class="mono" x="470" y="194" text-anchor="middle">DXB · SUN</text>
        <path d="M176 226l5 6-5 6-5-6z" fill="none" stroke="#d9b469" stroke-opacity=".5"/><text class="mono m" x="176" y="256" text-anchor="middle">JED · FRI</text>
        <text class="mono" id="etaT" x="300" y="300" text-anchor="middle">ETA 01:14:12</text>
      </g>

      <!-- 4 · coordinates: jet + car + hotel converge into one plan -->
      <g data-s="4">
        <path class="route flow" d="M160 150Q200 206 300 238"/><path class="route flow" d="M300 134L300 228" style="animation-delay:-.5s"/><path class="route flow" d="M440 150Q400 206 300 238" style="animation-delay:-1s"/>
        <g id="n-jet"><circle class="pulse" cx="160" cy="150" r="11" style="stroke:#e0b45a"/><circle cx="160" cy="150" r="9" fill="#0b0b0d" stroke="#e0b45a" stroke-width="1.4"/><circle cx="160" cy="150" r="3" fill="#e0b45a"/><text class="mono" id="t-jet" x="160" y="178" text-anchor="middle">JET</text></g>
        <g id="n-car"><circle cx="300" cy="134" r="9" fill="#0b0b0d" stroke="#d9b469" stroke-width="1.4"/><circle class="dotin" cx="300" cy="134" r="3" fill="#f2d99a"/><path class="tick" d="M296 134l3 3 6-6" stroke="#f2d99a" stroke-width="1.6" fill="none"/><text class="mono" id="t-car" x="300" y="162" text-anchor="middle">CAR</text></g>
        <g id="n-hotel"><circle cx="440" cy="150" r="9" fill="#0b0b0d" stroke="#d9b469" stroke-width="1.4"/><circle class="dotin" cx="440" cy="150" r="3" fill="#f2d99a"/><path class="tick" d="M436 150l3 3 6-6" stroke="#f2d99a" stroke-width="1.6" fill="none"/><text class="mono" id="t-hotel" x="440" y="178" text-anchor="middle">HOTEL</text></g>
      </g>

      <!-- 5 · accompanies: approach lights, a car waiting, a person on the line -->
      <g data-s="5">
        <g id="rw"></g>
        <circle class="blink" cx="294" cy="247" r="1.7" fill="#fff6dc"/><circle class="blink" cx="306" cy="247" r="1.7" fill="#fff6dc" style="animation-delay:.4s"/>
        <text class="mono" id="t-appr" x="300" y="176" text-anchor="middle">APPROACH</text>
        <circle class="pulse" cx="300" cy="340" r="8"/><circle cx="300" cy="340" r="3" fill="#f2d99a"/>
        <text class="mono" id="t-adv" x="300" y="382" text-anchor="middle">ADVISOR</text>
      </g>

      <!-- cockpit frame: everything outside the glass -->
      <path fill-rule="evenodd" fill="#08080a" d="M0 0H600V620H0ZM26 392L58 74Q300 8 542 74L574 392Z"/>
      <path d="M26 392L58 74Q300 8 542 74L574 392" class="hair" style="stroke-opacity:.5"/>
      <rect x="0" y="392" width="600" height="26" fill="#0b0b0e"/>
      <ellipse class="breathe" cx="300" cy="392" rx="270" ry="26" fill="url(#gl)"/>
      <line x1="26" y1="392" x2="574" y2="392" stroke="#d9b469" stroke-opacity=".55"/>
      <rect x="0" y="418" width="600" height="202" fill="#09090c"/>
      <line x1="0" y1="418" x2="600" y2="418" stroke="#d9b469" stroke-opacity=".18"/>
      <circle class="blink" cx="262" cy="405" r="2.4" fill="#d9b469"/><text class="mono m" x="272" y="408.5">LIVE · SIM</text>

      <!-- instruments -->
      <g class="inst">
        <circle cx="120" cy="525" r="62" fill="#060608" stroke="#d9b469" stroke-opacity=".25"/>
        <g clip-path="url(#ca)"><g id="att">
          <rect x="40" y="340" width="160" height="185" fill="rgba(217,180,105,.13)"/>
          <rect x="40" y="525" width="160" height="200" fill="#030304"/>
          <line x1="40" y1="525" x2="200" y2="525" stroke="#f2d99a" stroke-width="1.2"/>
          <g stroke="#d9b469" stroke-opacity=".5"><line x1="105" y1="505" x2="135" y2="505"/><line x1="112" y1="485" x2="128" y2="485"/><line x1="105" y1="545" x2="135" y2="545"/><line x1="112" y1="565" x2="128" y2="565"/></g>
        </g></g>
        <g id="bankT"></g>
        <path d="M90 525H108M132 525H150" stroke="#f2d99a" stroke-width="2.2"/><circle cx="120" cy="525" r="2.6" fill="#f2d99a"/>
        <circle cx="120" cy="525" r="58" fill="none" stroke="#d9b469" stroke-opacity=".5"/>

        <circle cx="300" cy="525" r="62" fill="#060608" stroke="#d9b469" stroke-opacity=".25"/>
        <g id="rose"></g>
        <circle cx="300" cy="525" r="23" fill="#060608" stroke="#d9b469" stroke-opacity=".4"/>
        <text class="mono v" id="hdT" x="300" y="530" text-anchor="middle" style="font-size:14px">087°</text>
        <path d="M294 462L306 462L300 471Z" fill="#f2d99a"/>

        <circle cx="480" cy="525" r="62" fill="#060608" stroke="#d9b469" stroke-opacity=".25"/>
        <g id="altG"></g>
        <line id="needle" x1="480" y1="525" x2="480" y2="484" stroke="#f2d99a" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="480" cy="525" r="3.4" fill="#f2d99a"/>
        
        <text class="mono m" x="120" y="606" text-anchor="middle">ATT</text><text class="mono m" x="300" y="606" text-anchor="middle">HDG</text><text class="mono m" x="480" y="606" text-anchor="middle">ALT</text>
      </g>
    </svg>
  </div>
<section class="panel" id="panel" aria-live="polite"></section>
</main>

<div id="final">
  <h3>عين واحدة ترافق رحلتك</h3>
  <p class="lead" style="margin:8px auto 18px">أنهيت الجولة.</p>
  <button class="btn gold" id="again" style="padding:13px 36px;font-size:18px">دع العين تتولى رحلتك</button>
</div>

<nav>
  <div class="steps" id="steps"></div>

var T={
ar:[
B("01","العين تراقب","«نرى ما قد يفوتك»","تتابع الرحلة والطقس والمعلومات التشغيلية من مصادر مرخّصة، وتنبّهك قبل أن تسأل. وما لا تعرفه تقوله.",
 ["أهلًا خالد. رحلتك إلى دبي بعد يومين، وأتابعها لك.","تأخرت رحلتك 25 دقيقة. أقترح تأخير السيارة بالقدر نفسه.","قيود المطار: لم أتمكن من التحقق بعد، أتابع وأصلك."],
 [["اعتمد التعديل","تم. موعد العشاء كما هو."],["اتركها كما هي","كما تشاء. تبقى السيارة في موعدها."]],
 "كل معلومة معها مصدرها وحالتها. وما لا نعرفه نقوله بوضوح: «لم أتمكن من التحقق بعد، أتابع وأصلك.»"),
B("02","العين تفهمك","«رحلتك لها طابعها الخاص»","تتذكر وقت إقلاعك وطائرتك وضيافتك، فلا تعيد عليها ما قلته مرة. وتحفظ فقط ما تصرّح به بنفسك.",
 ["أهلًا خالد. رحلتك المعتادة إلى دبي، هل أجهزها؟","كما تفضّل: إقلاع بعد الظهر، وG450، وقهوة عربية على متنها."],
 [["نعم، جهّزها","جهّزتها. لن أحجز ولن أرسل شيئًا قبل موافقتك."],["وجهة أخرى","إلى أين تود السفر؟"]],
 "لا نستنتج معلومات حساسة عنك، ولا نكشف تفاصيلك للمشغّل إلا بقدر ما يلزم للحصول على عرض. وتستطيع تعديل تفضيلاتك أو مسحها في أي وقت."),
B("03","العين تكتشف الفرص","«الفرصة المناسبة، في الوقت المناسب»","بإذنك، تقرأ تقويمك وبريدك لتقترح رحلة تناسب اجتماعاتك، ولا تدّعي التوافر قبل التحقق.",
 ["بإذنك، لاحظت في تقويمك اجتماعًا في دبي يوم الأحد.","تبدو هناك طائرة مناسبة مساء الجمعة، حسب آخر تحديث. التأكيد النهائي من المشغّل. هل أطلب عرضًا؟"],
 [["اطلب عرضًا","سأسأل المشغّل وأعود إليك. السعر يُحدد بعد تأكيد التوفر."],["ليس الآن","كما تشاء. لن أرسل شيئًا."]],
 "نعرض وجهتك وتوقيتك أولًا، والطائرة معلومة داعمة. لا عدّاد وهمي ولا ندرة مصطنعة، والتأكيد النهائي من المشغّل."),
B("04","العين تنسّق الرحلة","«من الطائرة إلى وجهتك»","الطائرة والسيارة والفندق في خطة واحدة، لكل منها حالتها الواضحة.",
 ["رحلتك إلى دبي بعد يومين. الطائرة بانتظار تأكيد المشغّل. السيارة والفندق جاهزان لاعتمادك."],
 [["اعتمد السيارة والفندق","اعتمدتهما وأضفتهما إلى رحلتك. أتابع الطائرة وأصلك فورًا."],["أخّر السيارة ساعة","عدّلتها. هل أبقي موعد العشاء؟"]],
 "العين تقترح وتجهّز، وأنت تعتمد. لا حجز ولا إرسال ولا حذف بدون موافقتك الصريحة."),
B("05","العين ترافقك","«عين واحدة ترافق رحلتك»","من الإقلاع إلى ما بعد الوصول. وإن احتجت إنسانًا فهو معك فورًا.",
 ["وصلت يا خالد. سيارتك بانتظارك.","حفظت تفضيلاتك للرحلة القادمة.","وإن أردت التحدث مع مستشار، فهو معك الآن."],
 [["تحدث مع مستشار","وصلتك بمستشارك. يرى رحلتك كاملة."],["شكرًا","في خدمتك."]],
 "كل خطوة تُسجَّل في سجل تدقيق. وكل قرار مالي أو تواصل خارجي يمر عبر الإنسان.")
],
en:[
B("01","The Eye watches","“We see what you might miss”","It follows the flight, the weather and the operational information from licensed sources, and tells you before you have to ask. What it doesn't know, it says.",
 ["Hello Khalid. Your Dubai trip is in two days, and I'm watching it for you.","Your flight is delayed 25 minutes. I suggest moving the car by the same amount.","Airport restrictions: I couldn't verify yet. I'm following up and will reach you."],
 [["Approve the change","Done. Your dinner time stays as it is."],["Leave it as is","As you wish. The car stays on schedule."]],
 "Every item carries its source and status. What we don't know, we say plainly: “I couldn't verify yet. I'm following up and will reach you.”"),
B("02","The Eye understands you","“Your journey has its own character”","It remembers your departure time, your aircraft and your hospitality, so you never repeat yourself. It keeps only what you choose to share.",
 ["Hello Khalid. Your usual trip to Dubai. Shall I prepare it?","As you like it: afternoon departure, a G450, Arabic coffee on board."],
 [["Yes, prepare it","Prepared. I won't book or send anything before you approve."],["Another destination","Where would you like to go?"]],
 "We never infer sensitive information about you, and share details with an operator only as needed to obtain a quote. You can edit or erase your preferences at any time."),
B("03","The Eye finds opportunities","“The right opportunity, at the right time”","With your permission, it reads your calendar and email to propose a trip that fits your meetings, and never claims availability before it is verified.",
 ["With your permission, I noticed a meeting in Dubai on Sunday in your calendar.","A suitable aircraft appears available Friday evening, per the latest update. Final confirmation comes from the operator. Shall I request a quote?"],
 [["Request a quote","I'll ask the operator and come back to you. Price is set once availability is confirmed."],["Not now","As you wish. I won't send anything."]],
 "We lead with your destination and timing; the aircraft is supporting detail. No fake countdowns or artificial scarcity, and final confirmation comes from the operator."),
B("04","The Eye coordinates the trip","“From the aircraft to your destination”","The aircraft, the car and the hotel in one plan, each with a clear status.",
 ["Your trip to Dubai, in two days. The aircraft awaits operator confirmation. The car and hotel are ready for your approval."],
 [["Approve car and hotel","Approved and added to your journey. I'm following the aircraft and will reach you right away."],["Move the car one hour later","Adjusted. Shall I keep the dinner time?"]],
 "The Eye proposes and prepares; you approve. No booking, sending or deleting without your explicit consent."),
B("05","The Eye accompanies you","“One eye, with you throughout”","From takeoff to after arrival. And if you need a person, they are with you at once.",
 ["You've arrived, Khalid. Your car is waiting.","I've saved your preferences for your next trip.","If you'd like to speak with an advisor, they're with you now."],
 [["Speak with an advisor","I've connected you to your advisor. They can see your whole journey."],["Thank you","At your service."]],
 "Every step is recorded in an audit log. Every financial decision or outside contact goes through a human.")
],
ru:[
B("01","Око наблюдает","«Мы видим то, что можно упустить»","Следит за рейсом, погодой и операционной информацией из лицензированных источников и предупреждает раньше, чем вы спросите. О том, чего не знает, говорит прямо.",
 ["Здравствуйте, Халид. Ваша поездка в Дубай через два дня, я слежу за ней.","Рейс задержан на 25 минут. Предлагаю сдвинуть автомобиль на столько же.","Ограничения аэропорта: пока не удалось проверить. Продолжаю и вернусь к вам."],
 [["Одобрить изменение","Готово. Время ужина прежнее."],["Оставить как есть","Как пожелаете. Автомобиль остаётся по расписанию."]],
 "У каждого пункта есть источник и статус. Чего мы не знаем, о том говорим прямо: «Пока не удалось проверить. Продолжаю и вернусь к вам»."),
B("02","Око понимает вас","«У вашего путешествия свой характер»","Помнит ваше время вылета, самолёт и сервис, поэтому не нужно повторять сказанное. Сохраняет только то, чем вы сами поделились.",
 ["Здравствуйте, Халид. Ваша обычная поездка в Дубай. Подготовить?","Как вы любите: вылет после обеда, G450, арабский кофе на борту."],
 [["Да, подготовить","Готово. Ничего не будет забронировано или отправлено без вашего одобрения."],["Другое направление","Куда желаете отправиться?"]],
 "Мы не делаем выводов о чувствительных данных и передаём оператору лишь то, что нужно для расчёта. Предпочтения можно изменить или стереть в любой момент."),
B("03","Око находит возможности","«Нужная возможность в нужный момент»","С вашего разрешения читает календарь и почту, чтобы предложить поездку под ваши встречи, и не заявляет о доступности до проверки.",
 ["С вашего разрешения: в вашем календаре встреча в Дубае в воскресенье.","В пятницу вечером, по последним данным, подходящий самолёт, похоже, доступен. Окончательное подтверждение даёт оператор. Запросить предложение?"],
 [["Запросить предложение","Спрашиваю оператора и вернусь к вам. Цена определяется после подтверждения доступности."],["Не сейчас","Как пожелаете. Ничего не отправляю."]],
 "Сначала направление и время, самолёт — вспомогательная деталь. Никаких фальшивых таймеров и искусственного дефицита; окончательное подтверждение даёт оператор."),
B("04","Око координирует поездку","«От самолёта до пункта назначения»","Самолёт, автомобиль и отель в одном плане, у каждого понятный статус.",
 ["Ваша поездка в Дубай через два дня. Самолёт ждёт подтверждения оператора. Автомобиль и отель готовы к вашему одобрению."],
 [["Одобрить авто и отель","Одобрено и добавлено в вашу поездку. Слежу за самолётом и сразу сообщу."],["Сдвинуть авто на час","Изменено. Оставить время ужина?"]],
 "Око предлагает и готовит, одобряете вы. Никаких бронирований, отправок и удалений без вашего явного согласия."),
B("05","Око сопровождает вас","«Одно Око рядом на всём пути»","От вылета до момента после прибытия. А если нужен человек, он рядом сразу.",
 ["Вы прибыли, Халид. Ваш автомобиль ждёт.","Ваши предпочтения сохранены для следующей поездки.","Если хотите поговорить с консультантом, он на связи прямо сейчас."],
 [["Связаться с консультантом","Соединяю с вашим консультантом. Ему доступна вся ваша поездка."],["Спасибо","Всегда к вашим услугам."]],
 "Каждый шаг фиксируется в журнале аудита. Любое финансовое решение или внешний контакт проходит через человека.")
],
tr:[
B("01","Göz izler","“Gözden kaçabilecekleri biz görürüz”","Uçuşu, havayı ve lisanslı kaynaklardan gelen operasyonel bilgileri takip eder, siz sormadan haber verir. Bilmediğini açıkça söyler.",
 ["Merhaba Halid. Dubai yolculuğunuz iki gün sonra, sizin için takip ediyorum.","Uçuşunuz 25 dakika gecikti. Aracı aynı süre kaydırmayı öneriyorum.","Havalimanı kısıtları: henüz doğrulayamadım. Takipteyim, size döneceğim."],
 [["Değişikliği onayla","Tamam. Akşam yemeği saati aynı kalıyor."],["Olduğu gibi kalsın","Dilediğiniz gibi. Araç planlanan saatte."]],
 "Her bilginin kaynağı ve durumu görünür. Bilmediğimizi açıkça söyleriz: “Henüz doğrulayamadım. Takipteyim, size döneceğim.”"),
B("02","Göz sizi anlar","“Yolculuğunuzun kendine özgü bir karakteri var”","Kalkış saatinizi, uçağınızı ve ikramlarınızı hatırlar; aynı şeyi tekrar etmezsiniz. Yalnızca sizin paylaştıklarınızı saklar.",
 ["Merhaba Halid. Her zamanki Dubai yolculuğunuz. Hazırlayayım mı?","Sevdiğiniz gibi: öğleden sonra kalkış, G450, uçakta Arap kahvesi."],
 [["Evet, hazırla","Hazırladım. Onayınız olmadan hiçbir şey rezerve etmem veya göndermem."],["Başka bir yer","Nereye gitmek istersiniz?"]],
 "Hassas bilgileri tahmin etmeyiz; operatörle yalnızca teklif almak için gerekenleri paylaşırız. Tercihlerinizi istediğiniz zaman düzenleyebilir veya silebilirsiniz."),
B("03","Göz fırsatları bulur","“Doğru fırsat, doğru zamanda”","İzninizle takviminizi ve e-postanızı okuyup toplantılarınıza uyan bir yolculuk önerir; doğrulanmadan müsaitlik iddia etmez.",
 ["İzninizle, takviminizde pazar günü Dubai'de bir toplantı gördüm.","Cuma akşamı için son güncellemeye göre uygun bir uçak müsait görünüyor. Nihai onay operatörden gelir. Teklif isteyeyim mi?"],
 [["Teklif iste","Operatöre soruyorum, size döneceğim. Fiyat, müsaitlik doğrulandıktan sonra belirlenir."],["Şimdi değil","Dilediğiniz gibi. Hiçbir şey göndermiyorum."]],
 "Önce varış ve zaman gelir; uçak destekleyici bilgidir. Sahte geri sayım ya da yapay kıtlık yoktur; nihai onay operatörden gelir."),
B("04","Göz yolculuğu koordine eder","“Uçaktan varış noktanıza”","Uçak, araç ve otel tek planda, her birinin net bir durumu var.",
 ["Dubai yolculuğunuz, iki gün sonra. Uçak operatör onayı bekliyor. Araç ve otel onayınıza hazır."],
 [["Aracı ve oteli onayla","Onaylandı ve yolculuğunuza eklendi. Uçağı takip ediyorum, hemen size döneceğim."],["Aracı bir saat ertele","Düzenlendi. Akşam yemeği saati kalsın mı?"]],
 "Göz önerir ve hazırlar; siz onaylarsınız. Açık onayınız olmadan rezervasyon, gönderim veya silme yapılmaz."),
B("05","Göz size eşlik eder","“Tek göz, yolculuğunuz boyunca yanınızda”","Kalkıştan varıştan sonrasına kadar. Bir insana ihtiyacınız olursa, hemen yanınızdadır.",
 ["Vardınız Halid. Aracınız sizi bekliyor.","Tercihlerinizi bir sonraki yolculuk için kaydettim.","Bir danışmanla görüşmek isterseniz, danışmanınız şu an hazır."],
 [["Danışmanla görüş","Sizi danışmanınıza bağladım. Yolculuğunuzun tamamını görebilir."],["Teşekkürler","Hizmetinizdeyim."]],
 "Her adım bir denetim kaydına işlenir. Her mali karar veya dış iletişim bir insandan geçer.")
]};
